global:
  scrape_interval: 5s
scrape_configs:
  - job_name: airclaim-api
    metrics_path: /metrics
    static_configs: [{targets: [api:8000]}]
  - job_name: airclaim-worker
    static_configs: [{targets: [agent-worker:8001]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: containers
    static_configs: [{targets: [cadvisor:8080]}]
  - job_name: prometheus
    static_configs: [{targets: [prometheus:9090]}]
  - job_name: grafana
    metrics_path: /metrics
    static_configs: [{targets: [grafana:3000]}]
  - job_name: model-stub
    metrics_path: /metrics
    static_configs: [{targets: [model-stub:8100]}]
  - job_name: jaeger
    metrics_path: /metrics
    static_configs: [{targets: [jaeger:14269]}]
